<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{ page.title }} — Qanomaly</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="/styles.css" />

<!-- Consent Default -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  const storedConsent = localStorage.getItem('consentMode');
  if (!storedConsent) {
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      personalization_storage: 'denied',
      functionality_storage: 'denied',
      security_storage: 'denied'
    });
  } else {
    gtag('consent', 'default', JSON.parse(storedConsent));
  }
</script>

<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){
  w[l]=w[l]||[];
  w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),
      dl=l!='dataLayer'?'&l='+l:'';
  j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
  f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-WV48VV9W');
</script>
<!-- End GTM -->
</head>

<body>

<!-- GTM NoScript -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WV48VV9W"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- HEADER -->
<header class="header" id="hdr">
  <div class="container wrap">
    <a href="/" class="brand" id="brand" aria-label="Qanomaly">
      <span class="mark"></span>
      <span class="word">Qanomaly</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="#community">Community</a>
      <a href="#story">Story</a>
      <a href="#services">Services</a>
      <a href="#partners">Partners</a>
      <a href="#team">Team</a>
      <a href="#contact">Contact</a>
    </nav>

    <button class="burger" id="burger" aria-label="Open menu"><span></span></button>
  </div>
</header>

<!-- OVERLAY MENU -->
<nav class="menu" id="menu" aria-label="Overlay Menu">
  <ul>
    <li><a href="#community">Community</a></li>
    <li><a href="#story">Story</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#partners">Partners</a></li>
    <li><a href="#team">Team</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>


<!-- ⭐ PAGE CONTENT INSERTED HERE ⭐ -->
{{ content }}


<!-- FOOTER -->
<footer class="section" style="padding:40px 0" data-mode="dark" data-accent="teal">
  <div class="container" style="opacity:.85">© <span id="yr"></span> Qanomaly Pty Ltd</div>
</footer>

<!-- CONSENT BANNER (LOCAL HTML WAY) -->
<div id="consent-banner">
  <div id="consent-banner-content">
    <p>We use cookies and similar technologies for analytics and advertising. You can accept or reject these.</p>
    <div id="consent-banner-buttons">
      <button id="consent-reject">Reject</button>
      <button id="consent-accept">Accept</button>
    </div>
  </div>
</div>

<script>
(function(){
  function init(){
    var banner = document.getElementById('consent-banner');
    var accept = document.getElementById('consent-accept');
    var reject = document.getElementById('consent-reject');

    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('consentMode')); } catch(e){}

    if (!stored) banner.style.display = 'block';

    function update(consent){
      gtag('consent', 'update', consent);
      localStorage.setItem('consentMode', JSON.stringify(consent));
      banner.style.display = 'none';
    }

    accept.onclick = function(){
      update({
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted',
        personalization_storage: 'granted',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
    };

    reject.onclick = function(){
      update({
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        personalization_storage: 'denied',
        functionality_storage: 'denied',
        security_storage: 'denied'
      });
    };
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

<!-- JS -->
<script src="/script.js"></script>

</body>
</html>
